name: Device or feature request
description: A device to simulate, or something rigtape should do
labels: ["enhancement"]
body:
  - type: textarea
    id: testing
    attributes:
      label: "What are you testing? (device type, protocol)"
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: "What should rigtape do?"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: "What do you do today instead?"
